<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Rover | Luxury SUVs</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

/* Navbar */
.navbar {
    width: 100%;
    height: 85px;
    padding: 0 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #101010;
    border-bottom: 1px solid #333;
}

.logo {
    font-size: 35px;
   
}
 
.child {
    display: flex;
    list-style: none;
    gap: 32px;
}

.child a,
.nav-icons a {
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 1.5px;
    transition: color 0.3s ease;
} 





@media (max-width: 900px) {
    .navbar {
        padding: 0 4%;
        flex-direction: column;
    }

    .logo {
        font-size: 19px;
        letter-spacing: 3px;
        flex-direction: column;
        
    }

    .nav-links {
        gap: 14px;
        flex-direction: column;
    }

    
    
}


    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">RANGE ROVER</div>

        <ul class="child">
            <li><a href="#">VEHICLES</a></li>
            <li><a href="#">SHOPPING TOOLS</a></li>
            <li><a href="#">OWNERS</a></li>
            <li><a href="#">EXPLORE</a></li>
        </ul>

        
    </nav>

    
</body>
</html>
