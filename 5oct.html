<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
        margin : 0px;
        height : 100vh;
        display : flex;
      
        justify-content: center;
        align-items:center;
        background : linear-gradient(to bottom, #ea371c, rgb(30, 57, 215), #4f38aa);
    }
    .loader {
            display: flex;
            gap: 25px;
             
        }
    

    .ball {
    width: 80px;
    height: 80px;
    background: linear-gradient(to bottom, #FF9933, white, #138808);
    border-radius: 50%;
    animation: loading 0.6s infinite alternate;
}
    
        .ball:nth-child(2) {
            animation-delay: 0.2s;
        }

        .ball:nth-child(3) {
            animation-delay: 0.4s;
        }
    @keyframes loading {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-30px) scale(1.3);
            }
        }
  </style>
</head>
<body>
    <div class ="loader">
        <div class="ball 1"> <hi><center>raj</center</hi>
        </div>
        <div class="ball 2"><hi><center>kunal</center</hi></div>
        <div class="ball 3"><hi><center>ashwin</center</hi></div>
    </div>
</body>
</html>
