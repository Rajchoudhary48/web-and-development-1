<!DOCTYPE html>
<html lang="en">

<head>

    <title>Moments</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #171717;
            color: white;
            /* height: 100vh; */
          
        }
.parent{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr ;
    grid-template-rows:200px 200px 150px  ;
    gap: 10px;
    margin: 10px;
}
       

        .label {
            font-size: 10px;
            color: #777;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 43px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        #h11{
            color: white;
            position: relative;
            top: -50x;
            background-color: red;
            z-index: 2;
        }


        .subtitle {
            font-size: 12px;
            color: #999;
            margin-bottom: 25px;
        }



        .child {
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            cursor: pointer;
            transition:
                transform 0.5s ease,
                filter 0.5s ease,
                opacity 0.5s ease;
        }

        img {
            width: 100%;
            height: 100%;
           
        }
        #h11{
            background-color: rgb(232, 225, 225);
            position: relative;
            top: 0px;
            z-index: 3;
        }

     #one{
        grid-row: span 3;
        grid-column: span 4 ;
     }

     .child{
        grid-columns:span 1 ;
     }  

        .child:hover {
            transform: scale(1.025);
            z-index: 10;
        }

        .child:hover img {
            transform: scale(1.12);
        }

        .parent:has(.child:hover) .child:not(:hover) {
            opacity: 0.55;
        }
    </style>
</head>


<body>
