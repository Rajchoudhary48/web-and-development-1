
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Rover Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #202329;
        }

        /* Top announcement bar */
        .top-bar {
            height: 48px;
            background: #0d121b;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .top-bar a {
            color: white;
            margin-left: 5px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* Main navigation */
        .navbar {
            height: 76px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-left a,
        .nav-right a {
            text-decoration: none;
            color: #4c5056;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.6px;
            white-space: nowrap;
        }

        .nav-left a:hover,
        .nav-right a:hover {
            color: black;
        }

        /* Center logo */
        .logo {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: #080808;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 6px;
            white-space: nowrap;
        }

        .nav-right .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 23px;
            height: 23px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }

        .search-icon {
            width: 25px;
            height: 25px;
        }

        /* Secondary navigation */
        .sub-navbar {
            height: 46px;
            display: flex;
            align-items: stretch;
            background: white;
            border-top: 1px solid #eeeeee;
            border-bottom: 1px solid #eeeeee;
        }

        .model-name {
            width: 225px;
            background: #56616b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .model-name span:last-child {
            font-size: 17px;
            font-weight: normal;
        }

        .overview {
            display: flex;
            align-items: center;
            padding: 0 24px;
            color: #171b23;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        /* Responsive navigation */
        @media (max-width: 1100px) {
            .nav-left,
            .nav-right {
                gap: 14px;
            }

            .nav-left a,
            .nav-right a {
                font-size: 10px;
                letter-spacing: 1px;
            }

            .logo {
                font-size: 14px;
                letter-spacing: 4px;
            }
        }

        @media (max-width: 800px) {
            .navbar {
                height: 68px;
                padding: 0 18px;
            }

            .nav-left a,
            .nav-right .nav-item span {
                display: none;
            }

            .nav-left,
            .nav-right {
                gap: 15px;
            }

            .logo {
                font-size: 13px;
                letter-spacing: 3px;
            }

            .top-bar {
                height: 42px;
                font-size: 11px;
                padding: 0 8px;
                text-align: center;
            }

            .model-name {
                width: 210px;
            }
        } 

        @media (max-width: 400px) {
            .logo {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .nav-right {
                gap: 8px;
            }

            .model-name {
                width: 200px;
            }
        }
    </style>
</head>

<body>

    <!-- Top announcement bar -->
    <div class="top-bar">
        Find your perfect Range Rover.
        <a href="#">Search in stock vehicles.</a>
    </div>

    <!-- Main navbar -->
    <nav class="navbar">

        <!-- Left menu -->
        <div class="nav-left">
            <a href="#">VEHICLES</a>
            <a href="#">OWNERS</a>
            <a href="#">EXPLORE</a>
            <a href="#">SHOP NOW</a>
        </div>

        <!-- Center logo -->
        <div class="logo">RANGE ROVER</div>

        <!-- Right menu -->
        <div class="nav-right">

            <a href="#" class="nav-item">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 22s7-7.2 7-13a7 7 0 0 0-14 0c0 5.8 7 13 7 13z"/>
                    <circle cx="12" cy="9" r="2.5"/>
                </svg>
                <span>RETAILERS</span>
            </a>

            <a href="#" class="nav-item">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M6 3h12v18l-6-4-6 4z"/>
                </svg>
                <span>BUILDS</span>
            </a>

            <a href="#" class="nav-item">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h10A2.5 2.5 0 0 1 18 5.5v6a2.5 2.5 0 0 1-2.5 2.5H10l-4 4v-4.2A2.5 2.5 0 0 1 3 11.5z"/>
                    <path d="M14 17h4l3 3v-4a2 2 0 0 0-2-2h-1"/>
                </svg>
                <span>SUPPORT &amp; CHAT</span>
            </a>

            <a href="#" aria-label="Search">
                <svg class="icon search-icon" viewBox="0 0 24 24">
                    <circle cx="10.5" cy="10.5" r="7"/>
                    <path d="m16 16 5 5"/>
                </svg>
            </a>

        </div>
    </nav>

    <!-- Secondary navbar -->
    <nav class="sub-navbar">
        <div class="model-name">
            <span>RANGE ROVER VELAR</span>
            <span>⌄</span>
        </div>

        <div class="overview">
            OVERVIEW
        </div>
    </nav>

</body>
</html>
